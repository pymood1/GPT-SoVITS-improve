# Temporary development-only experiment preset.
# This round isolates the custom multilingual BERT path after DPO ON/OFF
# produced the same acoustic degradation.
# Remove together with the temporary WebUI harness after the research direction
# is fixed.

preset_id: s1_multilingual_bert_ablation_round3
version: v5dev
acoustic_ablation: true

preprocess:
  # Disable the fork's multilingual BERT path and fall back to the original
  # GPT-SoVITS text-feature path. This is the only intended variable changed
  # from the previous Full FT / DPO OFF result.
  multilingual_bert: false
  multilingual_bert_model: google-bert/bert-base-multilingual-cased
  emotion_model: iic/emotion2vec_plus_large
  emotion_confidence: 0.35
  emotion_device: auto

training:
  batch_size: 7
  epochs: 15
  save_every_epoch: 5
  cases:
    - id: full_nodpo_upstream_bert
      label: Full FT / DPO OFF / Upstream BERT
      adapter: full
      dpo: false
      gpu: auto

controller:
  # Keep Controller out of the acoustic comparison.
  enabled: false
  steps: 500
  reuse_dataset: true
  emotion_names: ""
  gpu: auto

inference:
  same_sovits_for_all_cases: true
  fixed_sovits: GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5dev.pth
