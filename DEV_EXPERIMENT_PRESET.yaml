# Temporary development-only experiment preset.
# This round isolates DPO as the only GPT/S1 training variable that changes.
# Remove together with the temporary WebUI harness after the research direction
# is fixed.

preset_id: s1_dpo_acoustic_ablation_round2
version: v5dev

preprocess:
  # Keep the same text feature path as the previous run so DPO is isolated.
  multilingual_bert: true
  multilingual_bert_model: google-bert/bert-base-multilingual-cased
  emotion_model: iic/emotion2vec_plus_large
  emotion_confidence: 0.35
  emotion_device: auto

training:
  # Keep batch/epoch/precision path identical between cases.
  # S1 precision still comes from the upstream-compatible config (16-mixed).
  batch_size: 7
  epochs: 15
  save_every_epoch: 5
  cases:
    - id: full_nodpo
      label: Full FT / DPO OFF
      adapter: full
      dpo: false
      gpu: auto
    - id: full_dpo
      label: Full FT / DPO ON
      adapter: full
      dpo: true
      gpu: auto

controller:
  # Disabled for this acoustic ablation so Controller steering cannot confound
  # whether DPO changes speaker identity / naturalness.
  enabled: false
  steps: 500
  reuse_dataset: true
  emotion_names: ""
  gpu: auto

inference:
  same_sovits_for_all_cases: true
  fixed_sovits: GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5dev.pth
