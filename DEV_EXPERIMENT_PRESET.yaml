# Temporary development-only experiment preset.
# Edit this file in Git to define what the Kaggle one-click experiment runs.
# Remove it when the research direction is fixed.

preset_id: s1_retention_round1
version: v5dev

preprocess:
  multilingual_bert: true
  multilingual_bert_model: google-bert/bert-base-multilingual-cased
  emotion_model: iic/emotion2vec_plus_large
  emotion_confidence: 0.35
  emotion_device: auto

training:
  batch_size: 7
  epochs: 15
  dpo: true
  save_every_epoch: 5
  cases:
    - id: full
      label: Full FT
      adapter: full
      gpu: auto
    - id: vout
      label: V + Attention Out LoRA
      adapter: lora_v_o
      lora_rank: 8
      lora_alpha: 16
      gpu: auto
    - id: qkvout
      label: QKV + Attention Out LoRA
      adapter: lora_qkv_o
      lora_rank: 8
      lora_alpha: 16
      gpu: auto

controller:
  enabled: true
  steps: 500
  reuse_dataset: true
  emotion_names: ""
  gpu: auto

inference:
  same_sovits_for_all_cases: true
  fixed_sovits: GPT_SoVITS/pretrained_models/gsv-v5-pretrained/s2Gv5dev.pth
