name: Release cancelled S1 round 7
on:
  pull_request:
    branches: [research/grokking-gpt-sovits-20261121]
    paths: ['.github/workflows/s1-round7-cleanup.yml']
permissions:
  actions: write
  contents: read
jobs:
  release:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/s1-next-distillation-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Cancel only user-cancelled round 7 result collector
        run: |
          set -euo pipefail
          test "$REPO" = "pymood1/GPT-SoVITS-improve"
          run=45772036033
          gh api "repos/$REPO/actions/runs/$run" > /tmp/run.json
          jq -e '.head_sha == "4aba3ba15a254869b0ad3335c883f50dded7ecc0" and .head_branch == "research/s1-next-distillation-20261126" and .event == "pull_request"' /tmp/run.json >/dev/null
          if [ "$(jq -r .status /tmp/run.json)" != completed ]; then
            gh api -X POST "repos/$REPO/actions/runs/$run/cancel"
          fi
          for i in $(seq 1 24); do
            status=$(gh api "repos/$REPO/actions/runs/$run" --jq .status)
            echo "Round 7: $status"
            if [ "$status" = completed ]; then
              exit 0
            fi
            sleep 5
          done
          exit 1
