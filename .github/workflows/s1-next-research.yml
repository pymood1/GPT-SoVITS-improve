name: S1 Next research CPU checks
on:
  pull_request:
    branches: [research/grokking-gpt-sovits-20261121]
    paths:
      - 'GPT_SoVITS/AR/models/s1_next.py'
      - 'GPT_SoVITS/module/s1_next_bridge.py'
      - 'tools/*s1*.py'
      - 'tools/*acoustic*.py'
      - 'tools/check_s1_research.sh'
      - 'tools/kaggle_live_status.py'
      - 'tests/test_s1_next*.py'
      - '.github/workflows/s1-next-*.yml'
permissions:
  contents: read
jobs:
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/s1-next-distillation-20261126'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - name: Check latest commit for actual research code changes
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request,fnmatch
          url="https://api.github.com/repos/"+os.environ["REPO"]+"/commits/"+os.environ["HEAD"]
          request=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
          with urllib.request.urlopen(request,timeout=20) as response:
              files={x["filename"] for x in json.load(response)["files"]}
          patterns=("GPT_SoVITS/AR/models/s1_next.py","GPT_SoVITS/module/s1_next_bridge.py","tools/*s1*.py","tools/*acoustic*.py","tools/check_s1_research.sh","tools/kaggle_live_status.py","tests/test_s1_next*.py",".github/workflows/s1-next-*.yml")
          run=any(fnmatch.fnmatchcase(f,p) for f in files for p in patterns)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("run="+str(run).lower()+"\n")
          print("Research code changed:",run)
          PY
  cpu-architecture:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: s1-research-cpu-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run shared regression suite
        run: bash tools/check_s1_research.sh
      - name: Acoustic diagnostic CPU self-tests
        run: |
          python -m pip install numpy scipy soundfile
          PYTHONPATH=. python tools/acoustic_spectral_compare.py
          PYTHONPATH=. python tools/acoustic_noise_probe.py --selftest
          python tools/prepare_acoustic_zeroth_pairs.py --selftest
          python -m py_compile tools/prepare_acoustic_zeroth_pairs.py tools/acoustic_spectral_compare.py tools/s1_s2_cross_version.py tools/kaggle_s1_s2_cross_version.py
          python tools/acoustic_periodicity_probe.py
          python tools/s1_s2_paired_assessment.py --selftest
          python -m py_compile tools/s1_s2_blind_listening.py
          python tools/s1_s2_generalization_split.py --selftest
          python tools/acoustic_native_bandwidth.py --selftest
          python tools/s1_s2_cfm_midpoint.py
          PYTHONPATH=. python tools/s1_semantic_robustness.py --selftest
