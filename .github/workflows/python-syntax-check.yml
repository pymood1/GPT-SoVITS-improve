name: Python compatibility check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  py_compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python entry points
        run: |
          python -m py_compile \
            webui.py \
            tools/colab_fast_setup.py \
            tools/asr/config.py \
            tools/asr/fasterwhisper_asr.py \
            tools/asr/funasr_asr.py \
            tools/auto_emotion_sidecar.py \
            tools/emotion_dataset_builder.py \
            tools/emotion_training_pipeline.py \
            tools/run_emotion_v5_preprocess.py \
            tools/export_emotion_reference_prompts.py \
            tools/train_emotion_controller.py \
            GPT_SoVITS/AR/models/emotion_control.py \
            GPT_SoVITS/AR/models/t2s_model.py \
            GPT_SoVITS/AR/data/dataset.py \
            GPT_SoVITS/TTS_infer_pack/TTS.py \
            GPT_SoVITS/TTS_infer_pack/TextPreprocessor.py \
            GPT_SoVITS/inference_webui.py \
            GPT_SoVITS/prepare_datasets/1-get-text.py \
            GPT_SoVITS/prepare_datasets/2-get-hubert-wav32k.py \
            GPT_SoVITS/prepare_datasets/3-get-semantic.py \
            GPT_SoVITS/text/chinese.py \
            GPT_SoVITS/text/chinese2.py \
            GPT_SoVITS/text/korean.py \
            GPT_SoVITS/text/multilingual_bert.py


  multilingual_bert_helpers_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install text feature smoke dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "torch>=2.10" \
            "transformers>=4.51,<5"
      - name: Check multilingual BERT feature helpers
        env:
          PYTHONPATH: GPT_SoVITS
        run: |
          python - <<'PY'
          import torch

          from text.multilingual_bert import (
              DEFAULT_MULTILINGUAL_BERT,
              align_token_features_to_phones,
              checkpoint_multilingual_bert_config,
              pad_hidden_to_gpt_dimension,
          )

          source = torch.arange(
              3 * 768,
              dtype=torch.float32,
          ).reshape(3, 768)
          padded = pad_hidden_to_gpt_dimension(source)
          assert padded.shape == (3, 1024)
          assert torch.equal(padded[:, :768], source)
          assert torch.count_nonzero(padded[:, 768:]) == 0

          token_features = torch.tensor(
              [
                  [0.0, 0.0],
                  [1.0, 1.0],
                  [2.0, 2.0],
                  [9.0, 9.0],
              ]
          )
          aligned = align_token_features_to_phones(
              token_features,
              [(0, 0), (0, 2), (3, 5), (0, 0)],
              text_length=5,
              phone_count=4,
          )
          assert aligned.shape == (4, 2)
          assert aligned[:, 0].tolist() == [1.0, 1.0, 2.0, 2.0]

          enabled, model = checkpoint_multilingual_bert_config({})
          assert enabled is False
          assert model == DEFAULT_MULTILINGUAL_BERT

          enabled, model = checkpoint_multilingual_bert_config(
              {
                  "text_features": {
                      "multilingual_bert": True,
                      "multilingual_bert_model": "example/model",
                  }
              }
          )
          assert enabled is True
          assert model == "example/model"

          from text.multilingual_bert import (
              MultilingualBertFeatureExtractor,
          )

          extractor = MultilingualBertFeatureExtractor(
              "hf-internal-testing/tiny-random-bert",
              device="cpu",
              is_half=False,
          )
          english = extractor.extract(
              "Hello world",
              phone_count=5,
          )
          korean = extractor.extract(
              "안녕하세요",
              phone_count=7,
          )
          assert english.shape == (1024, 5)
          assert korean.shape == (1024, 7)
          assert torch.isfinite(english).all()
          assert torch.isfinite(korean).all()

          print("PY314_MULTILINGUAL_BERT_HELPERS_OK")
          print("PY314_MULTILINGUAL_BERT_MODEL_SMOKE_OK")
          PY
      - name: Compare vectorized emotion score with sequential reference
        env:
          PYTHONPATH: GPT_SoVITS
        run: |
          python - <<'PY'
          import torch

          from AR.models.emotion_control import (
              EmotionSamplingState,
              LowRankEmotionPreference,
              vectorized_sequence_relative_score,
          )

          torch.manual_seed(20261111)
          steps = 24
          hidden_dim = 16
          vocab = 40
          eos_id = vocab - 1

          controller = LowRankEmotionPreference(
              hidden_dim=hidden_dim,
              num_emotions=3,
              rank=4,
              max_log_odds_shift=0.35,
              prefix_log_ratio_budget=2.0,
          )
          with torch.no_grad():
              controller.u_proj.normal_(mean=0.0, std=0.08)

          hidden = torch.randn(steps, hidden_dim)
          output_weight = torch.randn(vocab, hidden_dim)

          raw = torch.randn(steps, vocab)
          values, indices = torch.topk(raw, 8, dim=-1)
          base_probs = torch.zeros_like(raw)
          base_probs.scatter_(
              1,
              indices,
              torch.softmax(values, dim=-1),
          )
          target_semantic = [
              int(indices[index, index % 8])
              for index in range(steps)
          ]
          valid_mask = [
              (index % 7) != 0
              for index in range(steps)
          ]

          def sequential_score(emotion_id):
              ratios = []
              state = EmotionSamplingState()
              for index, token in enumerate(target_semantic):
                  if not valid_mask[index]:
                      continue
                  p0 = base_probs[index : index + 1]
                  preference = controller.preference_scores(
                      hidden[index : index + 1],
                      output_weight,
                      emotion_id,
                      vocab_size=vocab,
                  )
                  steered, state = controller.tilt_probabilities(
                      base_probs=p0,
                      preference_scores=preference,
                      strength=1.0,
                      eos_id=eos_id,
                      state=state,
                  )
                  ratio = (
                      torch.log(
                          steered[0, token].clamp_min(1e-12)
                      )
                      - torch.log(
                          p0[0, token].clamp_min(1e-12)
                      )
                  )
                  ratios.append(ratio)
                  state.cumulative_log_ratio = (
                      state.cumulative_log_ratio
                      + ratio.detach()
                  )
              return torch.stack(ratios).mean()

          for emotion_id in range(3):
              reference = sequential_score(emotion_id)
              ref_grad = torch.autograd.grad(
                  reference,
                  controller.u_proj,
                  retain_graph=False,
              )[0]

              vectorized = vectorized_sequence_relative_score(
                  controller=controller,
                  hidden=hidden,
                  base_probs=base_probs,
                  target_semantic=target_semantic,
                  valid_mask=valid_mask,
                  output_weight=output_weight,
                  emotion_id=emotion_id,
                  eos_id=eos_id,
              )
              vec_grad = torch.autograd.grad(
                  vectorized,
                  controller.u_proj,
                  retain_graph=False,
              )[0]

              assert torch.allclose(
                  reference,
                  vectorized,
                  atol=1e-6,
                  rtol=1e-5,
              ), (emotion_id, reference, vectorized)
              assert torch.allclose(
                  ref_grad,
                  vec_grad,
                  atol=2e-6,
                  rtol=2e-5,
              ), emotion_id

          print("PY314_EMOTION_VECTOR_SCORE_EQUIVALENCE_OK")
          PY
      - name: Test emotion controller training vectorization and initialization
        env:
          PYTHONPATH: GPT_SoVITS
        run: |
          python -m unittest tests/test_emotion_control_training_vectorization.py


  dependency_resolve_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install -q uv
      - name: Resolve Python 3.14 dependencies
        run: |
          uv pip compile \
            --python-version 3.14 \
            requirements.txt \
            --output-file /tmp/requirements-314.txt
          grep -E '^(numpy|numba|librosa|resampy|pyopenjtalk-plus|mecab-ko|pydantic|torchmetrics|ctranslate2|av|huggingface-hub|hf-xet)==' \
            /tmp/requirements-314.txt || true


  text_frontend_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install modern text frontend dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "mecab-ko>=1.0.3" \
            "pyopenjtalk-plus>=0.4.1.post10" \
            "jieba-py>=0.46.12" \
            g2pk2 ko_pron jamo nltk
      - name: Prepare NLTK cmudict
        run: |
          python - <<'PY'
          import nltk
          nltk.download("cmudict", quiet=True)
          PY
      - name: Smoke Korean and Japanese frontends
        env:
          PYTHONPATH: GPT_SoVITS
        run: |
          python - <<'PY'
          import pyopenjtalk
          import jieba.posseg as psg

          from text.korean import g2p as korean_g2p

          ko = korean_g2p("안녕하세요")
          if not ko:
              raise SystemExit("Korean G2P returned no phones")

          ja = pyopenjtalk.g2p("こんにちは")
          if not ja.strip():
              raise SystemExit("OpenJTalk returned no phones")

          zh = psg.lcut("你好世界")
          if not zh:
              raise SystemExit("jieba.posseg returned no tokens")

          print("PY314_TEXT_FRONTEND_SMOKE_OK")
          print("ko_phones=", len(ko))
          print("ja=", ja)
          print("zh_tokens=", len(zh))
          PY



  resampy_runtime_smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install resampy runtime stack
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "numpy>=2.1,<3" \
            "numba>=0.61" \
            "resampy>=0.4.3,<0.5"
      - name: Exercise the exact filter API used by TTS.py
        run: |
          python - <<'PY'
          import resampy

          interp_win, precision, rolloff = (
              resampy.filters.get_filter("kaiser_best")
          )
          assert interp_win.ndim == 1
          assert interp_win.size > 0
          assert int(precision) > 0
          assert 0 < float(rolloff) <= 1

          print("RESAMPY_RUNTIME_SMOKE_OK")
          print("resampy=", resampy.__version__)
          PY

  numeric_stack_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python 3.14 numeric stack
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "numpy>=2.4,<3" \
            "numba>=0.68.1" \
            "librosa>=0.11,<0.12" \
            "resampy>=0.4.3,<0.5" \
            "pydantic>=2.12,<3"
      - name: Import numeric stack
        run: |
          python - <<'PY'
          import importlib
          import librosa
          import numba
          import numpy
          import pydantic
          import resampy

          importlib.import_module("numpy.strings")
          interp_win, precision, rolloff = (
              resampy.filters.get_filter("kaiser_best")
          )
          assert interp_win.ndim == 1
          assert int(precision) > 0
          assert 0 < float(rolloff) <= 1

          print("PY314_NUMERIC_STACK_SMOKE_OK")
          print("numpy=", numpy.__version__)
          print("numba=", numba.__version__)
          print("librosa=", librosa.__version__)
          print("resampy=", resampy.__version__)
          print("pydantic=", pydantic.__version__)
          PY

  ui_stack_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python 3.14 WebUI stack
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "gradio>=5.50,<6" \
            "fastapi[standard]>=0.115.2,<1" \
            "pydantic>=2.12,<3" \
            "audioop-lts<=0.2.2"
      - name: Build a Gradio Blocks app
        run: |
          python - <<'PY'
          import fastapi
          import gradio as gr
          import pydantic
          import starlette

          with gr.Blocks() as app:
              gr.Textbox(label="Python 3.14 smoke")

          config = app.get_config_file()
          if not config:
              raise SystemExit("Gradio Blocks config is empty")

          print("PY314_UI_STACK_SMOKE_OK")
          print("gradio=", gr.__version__)
          print("fastapi=", fastapi.__version__)
          print("starlette=", starlette.__version__)
          print("pydantic=", pydantic.__version__)
          PY
      - name: Check repository Gradio constructor keywords
        run: |
          python - <<'PY'
          import ast
          import inspect
          from pathlib import Path

          import gradio as gr

          files = [
              Path("webui.py"),
              Path("GPT_SoVITS/inference_webui.py"),
              Path("tools/subfix_webui.py"),
          ]

          errors = []
          checked = 0

          for path in files:
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  if not (
                      isinstance(func, ast.Attribute)
                      and isinstance(func.value, ast.Name)
                      and func.value.id == "gr"
                  ):
                      continue

                  name = func.attr
                  if not name[:1].isupper():
                      continue

                  target = getattr(gr, name, None)
                  if target is None or not callable(target):
                      continue

                  try:
                      sig = inspect.signature(target)
                  except (TypeError, ValueError):
                      continue

                  if any(
                      p.kind is inspect.Parameter.VAR_KEYWORD
                      for p in sig.parameters.values()
                  ):
                      continue

                  allowed = set(sig.parameters)
                  for kw in node.keywords:
                      if kw.arg is None:
                          continue
                      checked += 1
                      if kw.arg not in allowed:
                          errors.append(
                              f"{path}:{node.lineno} gr.{name} "
                              f"does not accept keyword {kw.arg!r}"
                          )

          if errors:
              raise SystemExit("\n".join(errors))

          print("PY314_GRADIO_API_SIGNATURE_SMOKE_OK")
          print("keywords_checked=", checked)
          PY



  asr_decode_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install released faster-whisper stack
        run: |
          python -m pip install -q uv
          uv pip install --system             "faster-whisper==1.2.1"             "av>=11,<19"             "ctranslate2>=4.6.1,<5"
      - name: Decode a WAV with faster-whisper on Python 3.14
        run: |
          python - <<'PY'
          import math
          import struct
          import tempfile
          import wave

          import av
          import ctranslate2
          import faster_whisper
          from faster_whisper.audio import decode_audio

          sample_rate = 16000
          frame_count = sample_rate // 4

          with tempfile.NamedTemporaryFile(suffix=".wav") as f:
              with wave.open(f.name, "wb") as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(sample_rate)
                  for i in range(frame_count):
                      sample = int(5000 * math.sin(2 * math.pi * 440 * i / sample_rate))
                      wav.writeframesraw(struct.pack("<h", sample))

              audio = decode_audio(f.name, sampling_rate=sample_rate)

          if len(audio) == 0:
              raise SystemExit("faster-whisper decoded zero samples")

          if int(av.__version__.split(".", 1)[0]) >= 19:
              raise SystemExit(f"PyAV regression: resolved av={av.__version__}")

          print("PY314_FASTER_WHISPER_DECODE_OK")
          print("faster_whisper=", faster_whisper.__version__)
          print("av=", av.__version__)
          print("ctranslate2=", ctranslate2.__version__)
          print("samples=", len(audio))
          PY


  hf_xet_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Hub/Xet transport
        run: |
          python -m pip install -q uv
          uv pip install --system             "huggingface_hub>=0.32,<1"             "hf_xet>=1.7"
      - name: Download a tiny file with the Colab Xet settings
        env:
          HF_HOME: /tmp/huggingface
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_HUB_DISABLE_UPDATE_CHECK: "1"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          HF_XET_HIGH_PERFORMANCE: "1"
        run: |
          python - <<'PY'
          from pathlib import Path

          import hf_xet
          import huggingface_hub
          from huggingface_hub import hf_hub_download

          paths = []
          for repo_id, local_dir in (
              (
                  "emotion2vec/emotion2vec_plus_large",
                  "/tmp/emotion2vec-plus-large",
              ),
              (
                  "emotion2vec/emotion2vec_plus_base",
                  "/tmp/emotion2vec-plus-base",
              ),
          ):
              path = Path(
                  hf_hub_download(
                      repo_id=repo_id,
                      filename="configuration.json",
                      local_dir=local_dir,
                      cache_dir="/tmp/huggingface/hub",
                  )
              )
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(
                      f"HF Xet smoke download produced no file: {repo_id}"
                  )
              paths.append(path)

          print("PY314_HF_XET_DOWNLOAD_OK")
          print("huggingface_hub=", huggingface_hub.__version__)
          print("hf_xet=", getattr(hf_xet, "__version__", "installed"))
          print("files=", paths)
          PY
      - name: Verify local emotion model preference
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.auto_emotion_sidecar import (
              DEFAULT_MODEL,
              LOCAL_EMOTION_MODELS,
              resolve_emotion_model,
          )

          for model_name, model_dir in LOCAL_EMOTION_MODELS.items():
              model_dir.mkdir(parents=True, exist_ok=True)
              for name in (
                  "model.pt",
                  "config.yaml",
                  "configuration.json",
                  "tokens.txt",
              ):
                  (model_dir / name).write_bytes(b"x")

              resolved = resolve_emotion_model(model_name)
              if Path(resolved) != model_dir:
                  raise SystemExit(
                      f"local emotion model was not preferred: "
                      f"{model_name} -> {resolved}"
                  )

          if DEFAULT_MODEL != "iic/emotion2vec_plus_large":
              raise SystemExit(
                  f"unexpected default emotion model: {DEFAULT_MODEL}"
              )

          print("PY314_LOCAL_EMOTION_MODELS_OK")
          PY


  colab_notebook_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Compile Colab notebook code cells
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Colab-Inference-Fast.ipynb")
          notebook = json.loads(path.read_text(encoding="utf-8"))

          for index, cell in enumerate(notebook.get("cells", [])):
              if cell.get("cell_type") != "code":
                  continue
              source = "".join(cell.get("source", []))
              compile(source, f"{path}:cell-{index}", "exec")

          print("COLAB_NOTEBOOK_CODE_CELLS_OK")
          PY


  emotion_pipeline_helpers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependency
        run: python -m pip install -q PyYAML
      - name: Test emotion preprocessing safeguards
        run: |
          python -m unittest discover \
            -s tests \
            -p test_emotion_pipeline_helpers.py \
            -v


  shell_syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installers
        run: bash -n install.sh
