name: Python compatibility check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  py_compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python entry points
        run: |
          python -m py_compile \
            webui.py \
            tools/colab_fast_setup.py \
            tools/asr/config.py \
            tools/asr/fasterwhisper_asr.py \
            tools/asr/funasr_asr.py \
            tools/auto_emotion_sidecar.py \
            tools/emotion_dataset_builder.py \
            tools/emotion_training_pipeline.py \
            tools/run_emotion_v5_preprocess.py \
            tools/train_emotion_controller.py \
            GPT_SoVITS/inference_webui.py \
            GPT_SoVITS/prepare_datasets/1-get-text.py \
            GPT_SoVITS/prepare_datasets/3-get-semantic.py \
            GPT_SoVITS/text/chinese.py \
            GPT_SoVITS/text/chinese2.py \
            GPT_SoVITS/text/korean.py

  dependency_resolve_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install -q uv
      - name: Resolve Python 3.14 dependencies
        run: |
          uv pip compile \
            --python-version 3.14 \
            requirements.txt \
            --output-file /tmp/requirements-314.txt
          grep -E '^(numpy|numba|librosa|pyopenjtalk-plus|mecab-ko|pydantic|torchmetrics)==' \
            /tmp/requirements-314.txt || true


  text_frontend_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install modern text frontend dependencies
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "mecab-ko>=1.0.3" \
            "pyopenjtalk-plus>=0.4.1.post10" \
            "jieba-py>=0.46.12" \
            g2pk2 ko_pron jamo nltk
      - name: Prepare NLTK cmudict
        run: |
          python - <<'PY'
          import nltk
          nltk.download("cmudict", quiet=True)
          PY
      - name: Smoke Korean and Japanese frontends
        env:
          PYTHONPATH: GPT_SoVITS
        run: |
          python - <<'PY'
          import pyopenjtalk
          import jieba.posseg as psg

          from text.korean import g2p as korean_g2p

          ko = korean_g2p("안녕하세요")
          if not ko:
              raise SystemExit("Korean G2P returned no phones")

          ja = pyopenjtalk.g2p("こんにちは")
          if not ja.strip():
              raise SystemExit("OpenJTalk returned no phones")

          zh = psg.lcut("你好世界")
          if not zh:
              raise SystemExit("jieba.posseg returned no tokens")

          print("PY314_TEXT_FRONTEND_SMOKE_OK")
          print("ko_phones=", len(ko))
          print("ja=", ja)
          print("zh_tokens=", len(zh))
          PY


  numeric_stack_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python 3.14 numeric stack
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "numpy>=2.4,<3" \
            "numba>=0.68.1" \
            "librosa>=0.11,<0.12" \
            "pydantic>=2.12,<3"
      - name: Import numeric stack
        run: |
          python - <<'PY'
          import importlib
          import librosa
          import numba
          import numpy
          import pydantic

          importlib.import_module("numpy.strings")

          print("PY314_NUMERIC_STACK_SMOKE_OK")
          print("numpy=", numpy.__version__)
          print("numba=", numba.__version__)
          print("librosa=", librosa.__version__)
          print("pydantic=", pydantic.__version__)
          PY


  ui_stack_smoke_314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python 3.14 WebUI stack
        run: |
          python -m pip install -q uv
          uv pip install --system \
            "gradio>=5.50,<6" \
            "fastapi[standard]>=0.115.2,<1" \
            "pydantic>=2.12,<3" \
            "audioop-lts<=0.2.2"
      - name: Build a Gradio Blocks app
        run: |
          python - <<'PY'
          import fastapi
          import gradio as gr
          import pydantic
          import starlette

          with gr.Blocks() as app:
              gr.Textbox(label="Python 3.14 smoke")

          config = app.get_config_file()
          if not config:
              raise SystemExit("Gradio Blocks config is empty")

          print("PY314_UI_STACK_SMOKE_OK")
          print("gradio=", gr.__version__)
          print("fastapi=", fastapi.__version__)
          print("starlette=", starlette.__version__)
          print("pydantic=", pydantic.__version__)
          PY


  shell_syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installers
        run: bash -n install.sh
