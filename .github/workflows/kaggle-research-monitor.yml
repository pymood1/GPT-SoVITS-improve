name: Kaggle research monitor
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/kaggle_monitor_request.json'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: kaggle-research-readonly-monitor
  cancel-in-progress: true
jobs:
  monitor:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/grokking-gpt-sovits-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Verify explicit monitor request
        id: request
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          changed = subprocess.check_output(["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"], text=True).splitlines()
          if "tools/kaggle_monitor_request.json" not in changed:
              print("No new monitor request")
          else:
              req = json.loads(Path("tools/kaggle_monitor_request.json").read_text())
              assert re.fullmatch(r"pymood1/gpt-sovits-research-[0-9]+", req["kernel"])
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("monitor=true\nkernel=" + req["kernel"] + "\n")
          PY
      - name: Install Kaggle CLI
        if: steps.request.outputs.monitor == 'true'
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5
      - name: Monitor existing experiment without GPU submission
        if: steps.request.outputs.monitor == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: pymood1
          GH_TOKEN: ${{ github.token }}
          RESEARCH_PR: ${{ github.event.pull_request.number }}
          KERNEL: ${{ steps.request.outputs.kernel }}
        run: python -u tools/kaggle_live_status.py "$KERNEL" "$RUNNER_TEMP/research-status-comment" 14400
