name: Quick checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile key Python files
        run: |
          python -m py_compile \
            webui.py \
            GPT_SoVITS/AR/modules/activation.py \
            GPT_SoVITS/AR/models/t2s_lightning_module.py \
            GPT_SoVITS/s1_train.py \
            GPT_SoVITS/TTS_infer_pack/TTS.py \
            GPT_SoVITS/f5_tts/model/backbones/dit.py \
            GPT_SoVITS/module/cache_dit.py \
            GPT_SoVITS/module/models.py \
            GPT_SoVITS/inference_webui.py \
            GPT_SoVITS/inference_webui_fast.py \
            tools/asr/fasterwhisper_asr.py \
            tools/asr/funasr_asr.py \
            tools/auto_emotion_sidecar.py \
            tools/build_emotion_review_set.py \
            tools/calibrate_emotion_seed_thresholds.py \
            tools/emotion_label_refiner.py \
            tools/evaluate_emotion_review.py \
            tools/kaggle_training_preflight.py

      - name: Validate notebooks as JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          # Legacy Colab-Inference.ipynb is not valid JSON in upstream/fork
          # history. Validate the notebooks actively maintained by this fork.
          notebooks = [
              Path("Colab-Inference-Fast.ipynb"),
              Path("Colab-WebUI.ipynb"),
              Path("GPT_SoVITS_Improve_Kaggle_Fast_Minimal.ipynb"),
          ]
          optional = Path("GPT_SoVITS_Improve_Kaggle_Training.ipynb")
          if optional.exists():
              notebooks.append(optional)

          for path in notebooks:
              with path.open("r", encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK: {path}")
          PY
