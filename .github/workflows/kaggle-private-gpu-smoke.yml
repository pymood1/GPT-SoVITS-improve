name: Kaggle private GPU smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kaggle-private-gpu-smoke.yml'
permissions:
  contents: read
concurrency:
  group: kaggle-private-gpu-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/grokking-gpt-sovits-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Require an explicit smoke workflow change in the head commit
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          # PR path filters are cumulative. Do not submit GPU jobs on
          # unrelated later commits or ordinary code changes.
          python - <<'PY'
          import json, os, re, urllib.request
          sha = os.environ["HEAD_SHA"]
          assert re.fullmatch("[0-9a-f]{40}", sha)
          req = urllib.request.Request(
              "https://api.github.com/repos/" + os.environ["REPO"] + "/commits/" + sha,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              data = json.load(response)
          changed = {item["filename"] for item in data.get("files", [])}
          requested = ".github/workflows/kaggle-private-gpu-smoke.yml" in changed
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("submit=" + str(requested).lower() + "\n")
          print("Explicit smoke request:", requested)
          PY
      - name: Check dedicated Kaggle credential availability
        if: steps.request.outputs.submit == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ] && [ -z "$KAGGLE_KEY" ]; then
            echo "::error::No dedicated Kaggle credential configured; no GPU job submitted."
            exit 1
          fi
          echo "Dedicated Kaggle credential available (value not shown)."
      - name: Install tested Kaggle CLI
        if: steps.request.outputs.submit == 'true'
        run: python -m pip install --disable-pip-version-check kaggle==2.2.5
      - name: Prepare private synthetic GPU training probe
        if: steps.request.outputs.submit == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/kaggle-smoke"
          cd "$RUNNER_TEMP/kaggle-smoke"
          python - <<'PY'
          import json, os
          from pathlib import Path
          slug = "gpt-sovits-gpu-smoke-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          meta = {
              "id": "pymood1/" + slug,
              "title": slug,
              "code_file": "smoke.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": True,
              "enable_internet": False,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": ["pymood1/w-voice-file"],
              "competition_sources": [],
              "kernel_sources": [],
              "model_sources": [],
          }
          Path("kernel-metadata.json").write_text(json.dumps(meta))
          PY
          cat > smoke.py <<'PY'
          import json
          from pathlib import Path
          import torch
          from torch import nn
          from torch.nn import functional as F
          torch.manual_seed(1234)
          count = torch.cuda.device_count()
          report = {
              "torch": torch.__version__,
              "cuda": torch.version.cuda,
              "gpu_count": count,
              "dataset_mounted": any(p.is_dir() for p in (
                  Path("/kaggle/input/datasets/pymood1/w-voice-file/datas"),
                  Path("/kaggle/input/w-voice-file/datas"),
              )),
              "tests": [],
          }
          def test(index, mixed):
              dev = torch.device("cuda", index)
              torch.cuda.manual_seed_all(1234)
              x = torch.randn(128, 16, device=dev)
              y = x[:, :4] * 0.5
              model = nn.Linear(16, 4).to(dev)
              opt = torch.optim.AdamW(model.parameters(), lr=0.02)
              scaler = torch.amp.GradScaler("cuda", enabled=mixed)
              losses = []
              for _ in range(32):
                  opt.zero_grad(set_to_none=True)
                  with torch.autocast("cuda", dtype=torch.float16, enabled=mixed):
                      loss = F.mse_loss(model(x), y)
                  scaler.scale(loss).backward()
                  scaler.step(opt)
                  scaler.update()
                  losses.append(float(loss.detach().cpu()))
              torch.cuda.synchronize(dev)
              return {
                  "gpu": index, "name": torch.cuda.get_device_name(dev),
                  "precision": "amp16" if mixed else "fp32",
                  "start_loss": losses[0], "end_loss": losses[-1],
                  "pass": losses[-1] < losses[0] * 0.5,
              }
          try:
              assert count == 2, f"Expected 2 GPUs, got {count}"
              for index in range(count):
                  for mixed in (False, True):
                      report["tests"].append(test(index, mixed))
              assert report["dataset_mounted"], "Expected dataset directory missing"
              assert all(t["pass"] for t in report["tests"]), "GPU optimization smoke failed"
              report["pass"] = True
          finally:
              Path("/kaggle/working/gpu-smoke.json").write_text(json.dumps(report, indent=2))
              print(json.dumps(report, indent=2))
          PY
          python -m py_compile smoke.py
      - name: Submit private Kaggle smoke job
        if: steps.request.outputs.submit == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: pymood1
        run: |
          kaggle kernels push -p "$RUNNER_TEMP/kaggle-smoke" --accelerator NvidiaTeslaT4 --timeout 600
      - name: Poll and retrieve only synthetic metrics
        if: steps.request.outputs.submit == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_USERNAME: pymood1
        run: |
          set -euo pipefail
          kernel="pymood1/gpt-sovits-gpu-smoke-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "Private kernel: $kernel"
          for i in $(seq 1 30); do
            status=$(kaggle kernels status "$kernel" 2>&1)
            echo "$status"
            if echo "$status" | grep -Eiq '(^|[.[:space:]])complete(d)?([[:space:]]|$)'; then
              mkdir -p "$RUNNER_TEMP/kaggle-metrics"
              kaggle kernels output "$kernel" -p "$RUNNER_TEMP/kaggle-metrics" --file-pattern 'gpu-smoke[.]json$'
              python - "$RUNNER_TEMP/kaggle-metrics/gpu-smoke.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              result = json.load(f)
          assert result.get("pass") is True
          assert result["gpu_count"] == 2
          print(json.dumps(result, indent=2))
          PY
              exit 0
            fi
            if echo "$status" | grep -Eiq '(^|[.[:space:]])(error|failed|cancelled)([[:space:]]|$)'; then
              kaggle kernels logs "$kernel" || true
              exit 1
            fi
            sleep 15
          done
          echo "::warning::Kaggle job not terminal yet; GPU success is not established. Query this private kernel later."
          exit 1
